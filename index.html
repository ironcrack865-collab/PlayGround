<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pixel Brawl — Starfall Arena</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap');
:root{--ink:#13152b;--cream:#fff2cf;--gold:#ffcf56;--pink:#ff5e83;--cyan:#59e4dc}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10152d;color:var(--cream);font-family:'Space Mono',monospace}body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#283866 0,#11172f 70%)}#game-shell{position:relative;width:min(100vw,1280px);aspect-ratio:16/9;max-height:100dvh;overflow:hidden;border:4px solid #d5a85c;box-shadow:0 0 0 4px #32254a,0 16px 70px #080a1b;image-rendering:pixelated;background:#131a38}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}.scanlines{pointer-events:none;position:absolute;inset:0;opacity:.11;background:repeating-linear-gradient(0deg,transparent 0 3px,#08091c 4px);mix-blend-mode:multiply}.corner{position:absolute;z-index:2;top:10px;font:8px 'Press Start 2P';color:#fff3d4;text-shadow:2px 2px #302343;pointer-events:none}.corner.left{left:12px}.corner.right{right:12px;text-align:right}.touch-ui{display:none;position:absolute;inset:auto 10px 12px;justify-content:space-between;align-items:end;pointer-events:none}.touch-group{display:flex;gap:8px;align-items:end;pointer-events:auto}.touch-btn{width:48px;height:48px;border:2px solid #fff3d4aa;border-radius:12px;background:#1a2348bb;color:white;font:10px 'Press Start 2P';touch-action:none;user-select:none;box-shadow:0 3px #090c20}.touch-btn.big{width:58px;height:58px;border-radius:50%;background:#c34868cc}.touch-btn:active{transform:translateY(3px);box-shadow:none;background:#f06b77}.touch-directions{display:grid;grid-template-columns:repeat(3,43px);grid-template-rows:repeat(2,42px);gap:4px}.touch-directions .touch-btn{width:43px;height:42px}.touch-directions .up{grid-column:2}.touch-directions .left{grid-column:1;grid-row:2}.touch-directions .down{grid-column:2;grid-row:2}.touch-directions .right{grid-column:3;grid-row:2}@media(max-width:700px){#game-shell{width:100vw;border-width:2px}.touch-ui{display:flex}.corner{font-size:6px;top:7px}.corner.left{left:7px}.corner.right{right:7px}}@media(max-height:500px){.touch-ui{transform:scale(.8);transform-origin:bottom center}}
</style>
</head>
<body><main id="game-shell"><canvas id="game" width="480" height="270" aria-label="Pixel Brawl game"></canvas><div class="corner left">STARFALL ARENA</div><div class="corner right">P1: ARROWS + Z/X</div><div class="scanlines"></div>
<div class="touch-ui"><div class="touch-group"><div class="touch-directions"><button class="touch-btn up" data-key="ArrowUp">▲</button><button class="touch-btn left" data-key="ArrowLeft">◀</button><button class="touch-btn down" data-key="ArrowDown">▼</button><button class="touch-btn right" data-key="ArrowRight">▶</button></div></div><div class="touch-group"><button class="touch-btn" data-key="KeyC">✦</button><button class="touch-btn big" data-key="KeyZ">HIT</button><button class="touch-btn big" data-key="ArrowUp">JMP</button></div></div></main>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const W=480,H=270,keys=new Set(),pressed=new Set();let mode='title',versus=false,paused=false,frame=0,last=0,shake=0,announce='',announceTimer=0,stageTime=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function keyDown(e){if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(!keys.has(e.code))pressed.add(e.code);keys.add(e.code)}function keyUp(e){keys.delete(e.code)}window.addEventListener('keydown',keyDown);window.addEventListener('keyup',keyUp);window.addEventListener('blur',()=>keys.clear());
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;for(const ev of ['pointerdown'])b.addEventListener(ev,e=>{e.preventDefault();keys.add(k);pressed.add(k)});for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>keys.delete(k))});
const stage={plats:[{x:85,y:207,w:310,h:12,kind:0},{x:130,y:160,w:78,h:7,kind:1},{x:272,y:160,w:78,h:7,kind:1},{x:215,y:123,w:50,h:7,kind:1}],floorY:219};
const colors=[{main:'#f26778',shade:'#b43e63',light:'#ffb26b',accent:'#ffe17a',name:'EMBER',icon:'✦'},{main:'#51c9d2',shade:'#287994',light:'#a1fff1',accent:'#a8a2ff',name:'NOVA',icon:'◆'}];
let fighters=[],particles=[],projectiles=[],stars=[];
for(let i=0;i<42;i++)stars.push({x:(i*97+21)%480,y:(i*53+7)%175,size:i%6===0?2:1,phase:i*.7});
function newFighter(id,x){return {id,x,y:180,vx:0,vy:0,w:14,h:23,face:id===0?1:-1,damage:0,stocks:3,onGround:false,jumps:0,attack:0,special:0,invuln:0,flash:0,eliminated:false,respawn:0,aiTimer:0,walk:0}}
function resetGame(isVersus=false){versus=isVersus;fighters=[newFighter(0,177),newFighter(1,303)];particles=[];projectiles=[];mode='play';paused=false;stageTime=0;announce='READY?';announceTimer=70}
function startOrToggle(code){if(mode==='title'){if(code==='Enter'||code==='Space')resetGame(false);if(code==='KeyV')resetGame(true)}else if(mode==='over'){if(code==='Enter'||code==='Space')resetGame(versus)}else if(code==='play'){if(code==='Escape'||code==='KeyP')paused=!paused}}
window.addEventListener('keydown',e=>{if(pressed.has(e.code))startOrToggle(e.code)});
function burst(x,y,color,n=8){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=.4+Math.random()*2;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:14+Math.random()*18,max:32,color,size:1+Math.random()*2})}}
function attack(f,special=false){if(f.eliminated||f.invuln||f.attack>0||f.special>0)return;if(special){f.special=32;projectiles.push({owner:f.id,x:f.x+f.face*10,y:f.y-10,vx:f.face*2.7,life:95,color:colors[f.id].light});burst(f.x+f.face*9,f.y-9,colors[f.id].accent,7)}else{f.attack=18;f.hitDone=false;burst(f.x+f.face*9,f.y-11,colors[f.id].accent,4)}}
function hit(target,source,power,dir){if(target.invuln||target.eliminated)return;const percent=target.damage;target.damage=Math.min(999,target.damage+power);let kb=(2.4+target.damage*.055)*power*.16;target.vx=dir*kb;target.vy=-kb*.72;target.onGround=false;target.jumps=Math.max(target.jumps,1);target.invuln=24;target.flash=9;shake=Math.min(8,2+target.damage*.035);burst(target.x,target.y-10,colors[target.id].light,9);if(target.damage>150)target.vy-=2;}
function knockOut(f){if(f.eliminated)return;f.stocks--;burst(f.x,f.y-8,'#fff0aa',22);shake=10;if(f.stocks<=0){f.eliminated=true;f.respawn=999;announce=colors[f.id].name+' OUT!';announceTimer=80}else{f.eliminated=true;f.respawn=55;announce='STOCK LOST!';announceTimer=48}}
function updateFighter(f,dt){if(f.eliminated){f.respawn-=dt;if(f.respawn<=0&&f.stocks>0){f.eliminated=false;f.x=f.id===0?175:305;f.y=92;f.vx=f.vy=0;f.damage=0;f.invuln=90;f.jumps=0;announce='BACK IN!';announceTimer=42}return}
const human=f.id===0||versus;let left=f.id===0?'ArrowLeft':'KeyA',right=f.id===0?'ArrowRight':'KeyD',jump=f.id===0?'ArrowUp':'KeyW',atk=f.id===0?'KeyZ':'KeyF',heavy=f.id===0?'KeyX':'KeyG',spec=f.id===0?'KeyC':'KeyH';let ax=0;
if(human){if(keys.has(left))ax--;if(keys.has(right))ax++;if(pressed.has(jump)){if(f.onGround||f.jumps<2){f.vy=-5.15;f.onGround=false;f.jumps++;burst(f.x,f.y+2,colors[f.id].light,4)}}if(pressed.has(atk))attack(f);if(pressed.has(heavy)){attack(f,true)}}else{const o=fighters[0],dx=o.x-f.x;f.aiTimer-=dt;if(f.aiTimer<=0){f.aiTimer=12+Math.random()*20;if(Math.abs(dx)>25)ax=Math.sign(dx);if(o.y<f.y-25&&Math.random()<.58)f.vy=-5.1;if(Math.abs(dx)<38&&Math.random()<.65)attack(f,Math.random()<.22)}if(Math.abs(dx)<44)ax=0;if(!f.onGround&&o.y<f.y-35&&Math.random()<.025)f.vy=-5}
if(ax){f.vx+=ax*.42;f.face=ax>0?1:-1;f.walk+=dt}else f.vx*=.79;f.vx=clamp(f.vx,-2.5,2.5);if(pressed.has(spec))attack(f,true);
f.vy+=.27*dt;f.vy=Math.min(6.5,f.vy);f.x+=f.vx*dt;f.y+=f.vy*dt;f.onGround=false;
for(const p of stage.plats){if(f.vy>=0&&f.y+f.h>=p.y&&f.y+f.h-f.vy*dt<=p.y&&f.x+f.w/2>p.x&&f.x-f.w/2<p.x+p.w){f.y=p.y-f.h;f.vy=0;f.onGround=true;f.jumps=0}}
if(f.x<4){f.x=4;f.vx=Math.abs(f.vx)*.6}if(f.x>476){f.x=476;f.vx=-Math.abs(f.vx)*.6}if(f.attack>0){f.attack-=dt;if(f.attack<10&&!f.hitDone){f.hitDone=true;for(const o of fighters){if(o===f||o.eliminated)continue;if(Math.abs(o.x-(f.x+f.face*16))<21&&Math.abs(o.y-f.y)<23)hit(o,f,8,f.face)}}}if(f.special>0)f.special-=dt;if(f.invuln>0)f.invuln-=dt;if(f.flash>0)f.flash-=dt;
if(f.y>H+20||f.x<-18||f.x>W+18)knockOut(f);
}
function update(dt){frame+=dt;if(mode!=='play'||paused)return;stageTime+=dt;if(announceTimer>0)announceTimer-=dt;for(const f of fighters)updateFighter(f,dt);for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i];p.x+=p.vx*dt;p.life-=dt;for(const f of fighters){if(f.id!==p.owner&&!f.eliminated&&Math.abs(f.x-p.x)<11&&Math.abs(f.y-12-p.y)<15){hit(f,fighters[p.owner],12,Math.sign(p.vx));p.life=0;burst(p.x,p.y,p.color,10)}}if(p.life<=0||p.x<0||p.x>W)projectiles.splice(i,1)}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.08*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}if(shake>0)shake*=.83;if(fighters.some(f=>f.stocks<=0)&&announceTimer<1)mode='over'}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function text(str,x,y,size=8,color='#fff2cf',align='center',font='Press Start 2P'){ctx.font=`${size}px '${font}'`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle='#25213e';ctx.fillText(str,x+1,y+2);ctx.fillStyle=color;ctx.fillText(str,x,y)}
function background(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1d2753');g.addColorStop(.58,'#554477');g.addColorStop(1,'#e58b78');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
// distant moon and twinkling stars
ctx.fillStyle='#ffdda0';ctx.beginPath();ctx.arc(363,67,24,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f7a58f';ctx.beginPath();ctx.arc(372,59,23,0,Math.PI*2);ctx.fill();for(const s of stars){let a=.45+.45*Math.sin(frame*.035+s.phase);rect(s.x,s.y,s.size,s.size,`rgba(255,244,197,${a})`)}
// skyline silhouettes
for(let i=0;i<14;i++){let x=i*39-5,h=28+(i*29%42);rect(x,174-h,26,h,'#35375e');rect(x+5,181-h,3,3,'#f9c977');rect(x+16,172-h,3,3,'#9b95c1')}
// floating islands
for(const [x,y,w] of [[35,123,53],[385,113,61]]){rect(x,y,w,5,'#7864a0');rect(x+5,y+5,w-10,4,'#463c72');rect(x+11,y+9,w-22,7,'#342f5c');rect(x+15,y+16,w-30,8,'#25284e')}
// floor haze and tiny pixel grass
rect(0,218,W,52,'#24294b');for(let i=0;i<80;i++){let x=(i*67)%480,y=226+(i*17%38);rect(x,y,2,1,i%3===0?'#687091':'#42496c')}
}
function drawStage(){for(const p of stage.plats){if(p.kind===0){rect(p.x,p.y,p.w,p.h,'#332747');rect(p.x,p.y,p.w,3,'#ffd56b');rect(p.x,p.y+4,p.w,p.h-4,'#795064');for(let x=p.x+8;x<p.x+p.w-3;x+=18){rect(x,p.y+7,7,2,'#ac6370');rect(x+8,p.y+4,2,2,'#f5a66f')}}else{rect(p.x,p.y,p.w,p.h,'#372a5a');rect(p.x+2,p.y-2,p.w-4,2,'#c8a9ff');rect(p.x+5,p.y+2,p.w-10,2,'#775f9f')}}
// center emblem
text('✦',240,201,13,'#ffe17a')}
function drawFighter(f){if(f.eliminated)return;const c=colors[f.id],x=Math.round(f.x),y=Math.round(f.y),walk=Math.sin(f.walk*1.1)*1.5,blink=f.invuln>0&&Math.floor(frame/4)%2===0;if(blink)return;
// shadow
rect(x-9,stage.floorY+2,18,2,'#141a32aa');
ctx.save();ctx.translate(x,y);ctx.scale(f.face,1);
// legs / boots
rect(-5,17+walk,4,5,'#25213e');rect(2,17-walk,4,5,'#25213e');rect(-6,21+walk,6,2,c.accent);rect(1,21-walk,6,2,c.accent);
// cape
rect(-8,2,4,12,c.shade);rect(-10,6,3,8,c.main);rect(-8,12,4,3,c.accent);
// torso + belt
rect(-5,4,10,13,c.main);rect(-5,12,10,3,c.shade);rect(-3,13,6,2,c.accent);
// head
rect(-6,-5,12,10,c.light);rect(-5,-8,10,4,c.shade);rect(-4,-9,7,3,c.accent);rect(1,-2,3,2,'#22203e');rect(4,-3,2,1,'#fff2cf');
// arm, raised when attacking
if(f.attack>0){rect(4,4,9,4,c.light);rect(11,2,7,7,c.accent);rect(15,1,7,2,'#fff2cf')}else{rect(5,6,4,7,c.light);rect(5,12,4,2,c.shade)}
// star pin
rect(-2,1,4,3,c.accent);ctx.restore();
if(f.flash>0){ctx.strokeStyle=c.light;ctx.lineWidth=1;ctx.strokeRect(x-9,y-10,18,33)}
}
function drawEffects(){for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);rect(p.x,p.y,p.size,p.size,p.color)}ctx.globalAlpha=1;for(const p of projectiles){ctx.fillStyle=p.color;ctx.fillRect(p.x-5,p.y-5,10,10);rect(p.x-2,p.y-8,4,16,'#fff4cb');rect(p.x-8,p.y-2,16,4,'#ffe289')}}
function hud(){for(let i=0;i<2;i++){const f=fighters[i],x=i===0?12:468,align=i===0?'left':'right',c=colors[i];rect(i===0?8:356,9,116,43,'#171a36cc');rect(i===0?8:356,9,116,2,c.main);text(c.name,i===0?15:465,19,7,c.light,align);text(`${String(f.damage).padStart(3,'0')}%`,i===0?15:465,34,11,f.damage>99?'#ff8b79':'#fff2cf',align);let sx=i===0?16:404;for(let s=0;s<f.stocks;s++){rect(sx+s*10,44,6,6,c.main);rect(sx+s*10+2,42,2,2,c.accent)}}
rect(192,8,96,16,'#191a36aa');text(versus?'LOCAL DUEL':'VS CPU',240,16,6,'#ffe39a');if(paused){rect(0,0,W,H,'#0c102dcc');text('PAUSED',240,119,15,'#ffe17a');text('PRESS P TO RESUME',240,145,7)}if(announceTimer>0&&announce){rect(144,90,192,42,'#171a36dd');rect(144,90,192,2,'#ffe17a');text(announce,240,111,announce.length>12?8:11,'#fff1c8')}}
function titleScreen(){drawFighter({...newFighter(0,160),x:160,y:170,walk:frame*.08});drawFighter({...newFighter(1,320),x:320,y:170,walk:frame*.08});rect(43,27,394,164,'#171832dc');rect(43,27,394,3,'#ffcf56');rect(46,31,388,157,'#252345');text('PIXEL',240,62,18,'#fff1c8');text('BRAWL',240,86,24,'#ffcf56');text('STARFALL ARENA',240,108,7,'#86e5db');rect(148,126,184,22,'#dd5c73');rect(148,126,184,2,'#ffc970');text('PRESS ENTER TO PLAY',240,137,7,'#fff5d9');text('V  LOCAL 2 PLAYER',240,161,6,'#b5b4da');text('A tiny arena. A very big launch.',240,177,6,'#938bb8','center','Space Mono');text('MOVE  ← →     JUMP  ↑    STRIKE  Z    STAR  X / C',240,233,5,'#fff0ce','center','Space Mono');text('FIRST TO LAST STOCK WINS',240,249,5,'#b5bad7','center','Space Mono')}
function overScreen(){for(const f of fighters)if(!f.eliminated)drawFighter(f);drawEffects();hud();rect(66,72,348,116,'#15172fee');rect(66,72,348,3,'#ffe17a');text('KNOCKOUT!',240,102,17,'#ffcf56');const winner=fighters.find(f=>f.stocks>0);text(winner?colors[winner.id].name+' WINS!':'DRAW!',240,132,10,winner?colors[winner.id].light:'#fff2cf');text('ENTER  REMATCH',240,166,7,'#fff1c8')}
function render(){ctx.save();ctx.clearRect(0,0,W,H);if(shake>0&&mode==='play')ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);background();drawStage();if(mode==='title'){titleScreen()}else if(mode==='over'){overScreen()}else{fighters.forEach(drawFighter);drawEffects();hud()}ctx.restore()}
canvas.addEventListener('pointerdown',e=>{if(mode!=='title'&&mode!=='over')return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;if(mode==='over'){resetGame(versus);return}if(y>120&&y<151)resetGame(false);else if(y>151&&y<174)resetGame(true)});
let previous=performance.now();function loop(now){const dt=Math.min(2,(now-previous)/16.667);previous=now;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
